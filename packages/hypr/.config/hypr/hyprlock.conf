# hyprlock.conf - minimal, Catppuccin Mocha
# Cocok dengan bar, rofi, dan kitty papa (base #1e1e2e, biru #89b4fa, teks #cdd6f4).
# Latar: screenshot yang di-blur, jadi wallpaper apa pun tetap nyambung.

general {
    disable_loading_bar = true
    grace = 300
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 200, 50
    position = 0, -80
    dots_center = true
    fade_on_empty = false
    font_color = rgb(cdd6f4)
    inner_color = rgb(1e1e2e)
    outer_color = rgb(89b4fa)
    outline_thickness = 5
    placeholder_text = Password...
    shadow_passes = 2
}

label {
    monitor =
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 55
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(bac2de)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}
