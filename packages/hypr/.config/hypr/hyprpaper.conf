# hyprpaper — wallpaper Hyprland
# Ganti path di bawah dengan file wallpaper papa.
# Setelah pull: pkill hyprpaper && hyprpaper & (atau login ulang)
#
# hyprpaper 0.8: format lama (preload = / wallpaper = ,path) sudah tidak ada.
# Pakai blok wallpaper; monitor kosong = fallback semua monitor.

wallpaper {
    monitor =
    path = $HOME/Pictures/wallpaper.jpg
}

splash = false

# IPC harus aktif supaya `hyprctl hyprpaper` (dipakai wallpaper-rotate.sh) bisa jalan.
ipc = true
